<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETR Agent{% block title %}{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #1a1a1a;
            margin: 0;
            line-height: 1.5;
        }

        nav {
            background: #0d2036;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        nav .brand { color: #fff; font-weight: 600; font-size: 15px; padding: 16px 0; }
        nav a { color: #aeb9c7; text-decoration: none; font-size: 14px; padding: 16px 0; border-bottom: 2px solid transparent; }
        nav a:hover { color: #fff; }
        nav a.active { color: #fff; border-bottom-color: #3b82f6; }

        .container { max-width: 880px; margin: 0 auto; padding: 32px 20px 60px; }

        h1 { font-size: 22px; color: #0d2036; margin: 0 0 4px 0; }
        .subtitle { color: #667085; font-size: 14px; margin-bottom: 24px; }

        .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 8px; padding: 28px; margin-bottom: 20px; }

        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #344054; }
        input[type="text"], select, textarea {
            width: 100%; padding: 9px 12px; border: 1px solid #d0d5dd; border-radius: 6px;
            font-size: 14px; margin-bottom: 16px; font-family: inherit; background: #fff; color: #1a1a1a;
        }
        textarea { min-height: 120px; resize: vertical; }
        textarea.code { font-family: 'Courier New', monospace; font-size: 13px; min-height: 480px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn {
            background: #1d4ed8; color: #fff; border: none; padding: 10px 20px; border-radius: 6px;
            font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block;
        }
        .btn:hover { background: #1742ab; }
        .btn-secondary { background: #15803d; }
        .btn-secondary:hover { background: #0f5c2d; }
        .btn-ghost { background: transparent; color: #475467; border: 1px solid #d0d5dd; }
        .btn-ghost:hover { background: #f0f2f5; }

        .status-badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em;
        }
        .status-questions { background: #dbeafe; color: #1e40af; }
        .status-generating { background: #e0e7ff; color: #3730a3; }
        .status-draft { background: #fef3c7; color: #92400e; }
        .status-approved { background: #dcfce7; color: #166534; }
        .status-error { background: #fee2e2; color: #991b1b; }

        .notice { background: #fef3c7; border-left: 3px solid #d97706; padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-bottom: 20px; }
        .notice ul { margin: 6px 0 0 18px; padding: 0; }
        .notice.error { background: #fee2e2; border-left-color: #b91c1c; }

        .document { background: #fff; border: 1px solid #e4e7ec; border-radius: 8px; padding: 36px; font-size: 15px; line-height: 1.6; }
        .document h1 { font-size: 20px; border-bottom: 2px solid #0d2036; padding-bottom: 8px; }
        .document h2 { font-size: 16px; color: #0d2036; margin-top: 30px; background: #f2f4f7; padding: 6px 10px; border-radius: 4px; }
        .document h3 { font-size: 14px; color: #15202b; margin-top: 20px; border-bottom: 1px solid #e4e6eb; padding-bottom: 4px; }
        .document table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .document th, .document td { border: 1px solid #d0d5dd; padding: 7px 10px; text-align: left; vertical-align: top; font-size: 13px; }
        .document th { background: #f2f4f7; }

        .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

        table.list { width: 100%; border-collapse: collapse; }
        table.list th, table.list td { padding: 10px 12px; border-bottom: 1px solid #e4e7ec; font-size: 13px; text-align: left; }
        table.list th { color: #667085; font-weight: 600; }
        table.list tr:hover { background: #f8fafc; }
        table.list a { color: #1d4ed8; text-decoration: none; font-weight: 600; }
        table.list a:hover { text-decoration: underline; }

        .empty { color: #667085; font-size: 14px; }
        .hint { color: #667085; font-size: 13px; margin-top: -10px; margin-bottom: 18px; }

        .spinner {
            width: 40px; height: 40px; margin: 0 auto;
            border: 4px solid #dbeafe; border-top-color: #1d4ed8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<nav>
    <span class="brand">ETR Agent</span>
    <a href="/" class="{{ 'active' if active == 'home' }}">New Specification</a>
    <a href="/history" class="{{ 'active' if active == 'history' }}">History</a>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
